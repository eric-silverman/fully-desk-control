; Fully Jarvis / Jiecang desk controller — ESP32 + HomeSpan
;
;   pio run -t upload          flash over USB
;   pio device monitor         serial console (115200)
;
; Board: generic 30-pin ESP-WROOM-32 devkit ("esp32dev" fits the DOIT
; DEVKIT V1 and the many clones sold as "ESP32 DevKitC 30-pin").

; Three build stages, see docs/SETUP.md. Bring them up in order.
;
;   pio run -e stage1 -t upload    buttons + serial console, no radio at all
;   pio run -e stage2 -t upload    + web dashboard          (needs secrets.h)
;   pio run -e stage3 -t upload    + native HomeKit         (default)

[platformio]
default_envs = stage3

[env]
; The PlatformIO registry's "espressif32" is frozen at arduino-esp32 2.x and
; HomeSpan 2.1 requires 3.0.2+, so this uses the pioarduino community fork,
; which is where arduino-esp32 3.x actually ships. Pinned deliberately:
; unpinned platform URLs turn a working build into a moving target.
platform      = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board         = esp32dev
framework     = arduino

monitor_speed = 115200
upload_speed  = 921600

; HomeSpan by git tag, not registry name. This version is matched to the
; platform above: HomeSpan 2.1.8 requires arduino-esp32 >= 3.3.0, which is
; what pioarduino 55.03.39 ships. Bump the two together or not at all.
lib_deps =
    https://github.com/HomeSpan/HomeSpan.git#release-2.1.8

; HomeSpan + WebServer + WiFi does not fit the 1.2 MB default app slot
; once debug symbols are in. huge_app gives 3 MB and drops OTA, which we
; do not use (flashing is over USB).
board_build.partitions = huge_app.csv

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wall

; --- stage 1: no radio -----------------------------------------------------
; Buttons and the serial console only. Proves the wiring and the desk link
; before WiFi can confuse the diagnosis. HomeSpan is never #included here,
; so it is not compiled in.
[env:stage1]
build_flags = ${env.build_flags} -DENABLE_WIFI=0 -DENABLE_HOMEKIT=0

; --- stage 2: + web dashboard ----------------------------------------------
; Needs src/secrets.h (copy from src/secrets.h.example).
[env:stage2]
build_flags = ${env.build_flags} -DENABLE_WIFI=1 -DENABLE_HOMEKIT=0

; --- stage 3: + native HomeKit ---------------------------------------------
[env:stage3]
build_flags = ${env.build_flags} -DENABLE_WIFI=1 -DENABLE_HOMEKIT=1

; ===========================================================================
; Seeed XIAO ESP32C3
; ---------------------------------------------------------------------------
; Same firmware, different pins (see src/config.h). Single-core RISC-V, two
; UARTs instead of three, no user LED. ARDUINO_USB_CDC_ON_BOOT routes the
; console over the native USB-C port so the serial monitor works without a
; separate adapter.
;
;   pio run -e xiao1 -t upload     etc.
; ===========================================================================
[xiao]
board       = seeed_xiao_esp32c3
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1

[env:xiao1]
board       = ${xiao.board}
build_flags = ${xiao.build_flags} -DENABLE_WIFI=0 -DENABLE_HOMEKIT=0

[env:xiao2]
board       = ${xiao.board}
build_flags = ${xiao.build_flags} -DENABLE_WIFI=1 -DENABLE_HOMEKIT=0

[env:xiao3]
board       = ${xiao.board}
build_flags = ${xiao.build_flags} -DENABLE_WIFI=1 -DENABLE_HOMEKIT=1
